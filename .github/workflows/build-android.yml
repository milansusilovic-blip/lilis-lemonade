name: Build Android (Play Store)

# Builds an UNSIGNED release AAB. Signing happens outside GitHub with the
# owner's upload key, so no secrets are stored in this repository.
# The result is pushed to the "builds-whizzbang" branch.

on:
  push:
    branches: [whizzbang-workshop]
    paths-ignore:
      - "docs/**"
      - "store/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in Play Store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install packages
        run: npm install

      - name: Copy game into Android project
        run: npx cap sync android

      - name: Build release AAB (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: whizzbang-workshop-${{ env.VERSION_NAME }}-build${{ github.run_number }}-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish AAB to the builds branch
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cp android/app/build/outputs/bundle/release/app-release.aab "$OUT/whizzbang-workshop-${VERSION_NAME}-build${VERSION_CODE}-unsigned.aab"
          cd "$OUT"
          printf 'Version %s, build %s, from commit %s\n' "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA" > BUILD.txt
          git init -q -b builds-whizzbang
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${VERSION_NAME} (${VERSION_CODE})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds-whizzbang
