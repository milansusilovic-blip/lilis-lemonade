<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4fc1f0">
<title>Lili's Lemonade</title>
<style>
@font-face{font-family:'Fredoka';src:url('fonts/Fredoka.ttf') format('truetype');font-weight:300 700;font-display:block}
@font-face{font-family:'Lobster';src:url('fonts/Lobster.ttf') format('truetype');font-weight:400;font-display:block}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{user-select:none;-webkit-user-select:none;overscroll-behavior:none}
</style>
</head>
<body>
<style>
/* Layout: one portrait game stage (400×720 logical), two scenes (street, boutique) on one canvas, HTML buttons at the bottom, item card slides up over the stage */
:root{
  --sky:#bfe9fb; --ink:#3a1f3d; --pink:#ff5d8f; --pink-soft:#fff2f7;
  --lemon:#ffd23f; --mint:#2ec4b6; --paper:#ffffff; --muted:#8a6f8c; --gold:#f4c430; --plum:#6a24b8;
  --display:'Fredoka','Trebuchet MS','Segoe UI',sans-serif;
  --script:'Lobster','Brush Script MT',cursive;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{height:100%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#wrap{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(60,30,80,.25);touch-action:manipulation}
canvas#game{display:block;cursor:pointer}
.controls{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:8px;justify-content:center;padding-inline:10px}
.btn{font-family:var(--display);font-weight:600;font-size:15px;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.b-lemon{background:var(--lemon);color:var(--ink)}
.b-pink{background:var(--pink);color:var(--paper)}
.b-mint{background:var(--mint);color:var(--paper)}
.b-ghost{background:var(--paper);color:var(--ink)}
.b-plum{background:var(--plum);color:#ffd84a}
.itemcard{position:absolute;left:0;right:0;bottom:62px;display:flex;justify-content:center;padding-inline:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.itemcard{animation:none}}
.tray{width:100%;max-width:360px;background:var(--paper);border:3px solid var(--gold);border-radius:20px;padding:10px 12px;box-sizing:border-box;
  display:flex;gap:12px;align-items:center;box-shadow:0 0 0 4px rgba(255,214,64,.4),0 10px 26px rgba(58,31,61,.3)}
.tray canvas{width:120px;height:96px;flex:0 0 auto;background:#fff7c2;border-radius:14px}
.info{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.info .cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.info .nm{font-family:var(--script);font-size:24px;line-height:1.1;color:var(--plum)}
.info .pr{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.info .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.info .btn{font-size:13px;padding:7px 12px}
</style>

<div id="stage">
  <div id="wrap">
    <canvas id="game" aria-label="Game: Lili sells lemonade and shops at the boutique"></canvas>
    <div class="controls">
      <button class="btn b-lemon" id="refillBtn">Make lemonade · $1</button>
      <button class="btn b-pink" id="shopBtn">Go to the boutique</button>
      <button class="btn b-plum" id="leaveBtn" hidden>Back to the stand</button>
    </div>
    <div class="itemcard" id="itemCard" hidden>
      <div class="tray">
        <canvas id="itemCv" width="240" height="192"></canvas>
        <div class="info">
          <div class="cat" id="icCat">Bag</div>
          <div class="nm" id="icName">Item</div>
          <div class="pr" id="icPrice">$0</div>
          <div class="row">
            <button class="btn b-pink" id="icBuy">Buy</button>
            <button class="btn b-ghost" id="icClose">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const W=400,H=720,GROUND=300;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const bgStreet=document.createElement('canvas'),bgShop=document.createElement('canvas');
let scale=1,dpr=1,scene='street';

/* ---------- catalog ---------- */
const CATS={bag:'Bag',dress:'Dress',glasses:'Sunglasses',hat:'Hat',shoes:'Shoes'};
const ITEMS=[
 {id:'b1',cat:'bag',name:'Little Clutch',price:10,color:'#ffd166',trim:'#ff8fab',shape:'clutch',x:45,y:174},
 {id:'b2',cat:'bag',name:'Round Bag',price:20,color:'#7bdff2',trim:'#ffffff',shape:'round',x:105,y:172},
 {id:'b3',cat:'bag',name:'Shopper Tote',price:35,color:'#b388eb',trim:'#ffd23f',shape:'tote',x:165,y:172},
 {id:'b4',cat:'bag',name:'Sweetheart',price:50,color:'#ff5d8f',trim:'#ffffff',shape:'heart',x:45,y:230},
 {id:'b5',cat:'bag',name:'Golden Evening',price:80,color:'#f4c430',trim:'#9c6b00',shape:'bucket',x:105,y:232},
 {id:'b6',cat:'bag',name:'Designer Tote',price:120,color:'#2ec4b6',trim:'#f4c430',shape:'tote',x:165,y:230},
 {id:'d1',cat:'dress',name:'Sunny Polka',price:15,color:'#ffd23f',trim:'#ffffff',x:246,y:302},
 {id:'d2',cat:'dress',name:'Mint Sundress',price:30,color:'#7fe0c4',trim:null,x:296,y:302},
 {id:'d3',cat:'dress',name:'Party Purple',price:60,color:'#9b5de5',trim:'#f4c430',x:346,y:302},
 {id:'g1',cat:'glasses',name:'Heart Shades',price:8,color:'#ff5d8f',shape:'heart',x:70,y:404},
 {id:'g2',cat:'glasses',name:'Classic Black',price:12,color:'#1d1d2b',shape:'round',x:96,y:398},
 {id:'g3',cat:'glasses',name:'Gold Cat-Eye',price:40,color:'#e0a800',shape:'cat',x:122,y:404},
 {id:'h1',cat:'hat',name:'Straw Sun Hat',price:14,color:'#f6e3a8',trim:'#ff8fab',shape:'sun',x:281,y:452},
 {id:'h2',cat:'hat',name:'Pink Beret',price:22,color:'#ff7aa2',trim:null,shape:'beret',x:331,y:452},
 {id:'h3',cat:'hat',name:'Starlet Hat',price:45,color:'#ffffff',trim:'#1d1d2b',shape:'wide',x:306,y:418},
 {id:'s1',cat:'shoes',name:'Pink Sneakers',price:12,color:'#ff8fab',shape:'sneaker',x:90,y:560},
 {id:'s2',cat:'shoes',name:'Ruby Heels',price:35,color:'#d62839',shape:'heel',x:142,y:560}
];
// where Lili stands to look at each display
const SPOT={bag:{x:105,y:336},dress:{x:296,y:420},glasses:{x:96,y:478},hat:{x:306,y:548},shoes:{x:116,y:622}};
const PRICE=2,MAXCUPS=6;
const byId=id=>ITEMS.find(i=>i.id===id);

let S={money:0,owned:[],wear:{},served:0};
try{const d=JSON.parse(localStorage.getItem('lili-save')||'null');if(d){S=Object.assign(S,d);if(d.equipped&&!S.wear.bag)S.wear.bag=d.equipped;delete S.equipped;S.wear=S.wear||{}}}catch(e){}
function save(){try{localStorage.setItem('lili-save',JSON.stringify(S))}catch(e){}}

let cups=MAXCUPS,refill={on:false,t:0};
const girl={x:150,y:420,mode:'stand',dir:1,ph:0,path:[],onArrive:null};
let people=[],cars=[],parts=[],sparkles=[];
const slots=[{x:105,p:null},{x:150,p:null},{x:195,p:null}];
let spawnT=1,carT=3,hint={text:'Tap a customer to sell lemonade!',t:5},pitcherFlash=0,time=0;
let keeper={say:'',t:0},cardItem=null;
const clouds=[{x:60,y:100,s:.7,v:6},{x:250,y:92,s:.9,v:4}];
const birds=[{x:120,y:100,v:18},{x:140,y:108,v:18}];
const dog={x:262,y:478,wag:0};

/* ---------- helpers ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function say(t,s=2.4){hint={text:t,t:s}}
const depth=y=>0.62+(y-GROUND)/340*0.55;
function heartPath(c,x,y,r){c.beginPath();c.moveTo(x,y+r*.9);c.bezierCurveTo(x-r*1.6,y-r*.1,x-r*.7,y-r*1.3,x,y-r*.4);c.bezierCurveTo(x+r*.7,y-r*1.3,x+r*1.6,y-r*.1,x,y+r*.9);c.closePath()}
function shadow(x,y,w){ctx.fillStyle='rgba(70,45,30,.2)';ctx.beginPath();ctx.ellipse(x+3,y+1,w,w*.32,0,0,7);ctx.fill()}
const VX=200,VY=-520;
const lineX=(bx,y)=>VX+(bx-VX)*((y-VY)/(645-VY));
const rowY=k=>GROUND+345*Math.pow(k/9,1.35);

/* ---------- street background ---------- */
function palm(c,x,baseY,h,lean){
  const tx=x+lean,ty=baseY-h;
  c.fillStyle='rgba(70,45,30,.16)';c.beginPath();c.ellipse(x+40,baseY+10,48,10,0,0,7);c.fill();
  c.strokeStyle='#a0703f';c.lineWidth=7;c.lineCap='round';
  c.beginPath();c.moveTo(x,baseY);c.quadraticCurveTo(x+lean*.2,baseY-h*.55,tx,ty);c.stroke();
  c.strokeStyle='rgba(90,55,25,.35)';c.lineWidth=2;
  for(let i=1;i<9;i++){const t=i/9,px=x+(tx-x)*t*t,py=baseY-h*t;c.beginPath();c.moveTo(px-4,py);c.lineTo(px+4,py-2);c.stroke()}
  [-2.85,-2.3,-1.75,-1.25,-0.75,-0.25,0.25,2.6,0.8].forEach((a,i)=>{
    const L=50,ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.5+18,mx=(tx+ex)/2,my=(ty+ey)/2;
    c.fillStyle=i%2?'#3fae6a':'#2f9157';
    c.beginPath();c.moveTo(tx,ty);c.quadraticCurveTo(mx,my-16,ex,ey);c.quadraticCurveTo(mx+2,my-4,tx,ty);c.fill();
  });
  c.fillStyle='#7a4a22';[[-4,6],[4,7],[0,9]].forEach(([dx,dy])=>{c.beginPath();c.arc(tx+dx,ty+dy,4,0,7);c.fill()});
  c.fillStyle='#f4f0ea';c.beginPath();c.moveTo(x-16,baseY-8);c.lineTo(x+16,baseY-8);c.lineTo(x+19,baseY+2);c.lineTo(x-19,baseY+2);c.fill();
  c.fillStyle='#e2d9cd';c.fillRect(x-19,baseY+2,38,14);
  c.fillStyle='#6b4a2e';c.beginPath();c.ellipse(x,baseY-3,13,3,0,0,7);c.fill();
}
function plazaGrid(c,col){
  c.strokeStyle=col;c.lineWidth=1.3;
  for(let bx=-600;bx<=1000;bx+=56){c.beginPath();c.moveTo(lineX(bx,GROUND),GROUND);c.lineTo(bx,645);c.stroke()}
  for(let k=1;k<9;k++){const y=rowY(k);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
}
function drawStreetStatic(c){
  let g=c.createLinearGradient(0,0,0,130);g.addColorStop(0,'#4fc1f0');g.addColorStop(1,'#bdeefc');
  c.fillStyle=g;c.fillRect(0,0,W,140);
  c.fillStyle='#fbefe0';c.fillRect(0,122,206,178);
  c.fillStyle='#ffffff';c.fillRect(0,116,206,10);
  [22,112].forEach(x=>{
    c.fillStyle='#e9d6bd';c.beginPath();c.moveTo(x-3,250);c.lineTo(x-3,180);c.arc(x+33,180,36,Math.PI,0);c.lineTo(x+69,250);c.fill();
    c.fillStyle='#9fd8f5';c.beginPath();c.moveTo(x,248);c.lineTo(x,182);c.arc(x+33,182,33,Math.PI,0);c.lineTo(x+66,248);c.fill();
    c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.moveTo(x+8,240);c.lineTo(x+8,190);c.lineTo(x+22,165);c.lineTo(x+22,240);c.fill();
    c.fillStyle='#c97b5a';c.fillRect(x-4,248,74,9);
    ['#ff5d8f','#ffd23f','#ffffff','#ff8fab'].forEach((f,i)=>{for(let k=0;k<3;k++){c.fillStyle='#4caf63';c.beginPath();c.arc(x+4+i*18+k*5,247,4,0,7);c.fill();c.fillStyle=f;c.beginPath();c.arc(x+6+i*18+k*5,244,2.5,0,7);c.fill()}});
  });
  for(let i=0;i<26;i++){c.fillStyle=i%3?'#e84a8a':'#ff7fb0';c.beginPath();c.arc(4+i*8,124+Math.sin(i*1.7)*6,7,0,7);c.fill()}
  c.fillStyle='#ffc2d6';c.fillRect(206,104,194,196);
  c.fillStyle='#ffffff';c.fillRect(202,96,198,12);
  rr(c,236,116,140,32,9);c.fill();
  c.fillStyle='#d6336c';c.font='700 19px Fredoka, sans-serif';c.textAlign='center';c.fillText('BIJOU BOUTIQUE',306,139);c.textAlign='left';
  for(let i=0;i<10;i++){c.fillStyle=i%2?'#fff':'#ff5d8f';c.fillRect(206+i*19.4,160,19.4,22);c.beginPath();c.arc(215.7+i*19.4,182,9.7,0,Math.PI);c.fill()}
  c.fillStyle='rgba(120,40,70,.12)';c.fillRect(206,192,194,8);
  c.fillStyle='#fff';c.fillRect(216,204,80,90);
  const wg=c.createLinearGradient(220,208,292,290);wg.addColorStop(0,'#eefaff');wg.addColorStop(1,'#c3e8f8');
  c.fillStyle=wg;c.fillRect(221,209,70,80);c.fillStyle='#fff';c.fillRect(221,250,70,3);
  c.fillStyle='#e6447e';rr(c,306,204,58,96,6);c.fill();
  c.fillStyle='#ffe3ee';rr(c,313,212,44,48,4);c.fill();
  c.fillStyle='#f4c430';c.beginPath();c.arc(354,272,3.5,0,7);c.fill();
  c.fillStyle='#d6336c';rr(c,372,214,22,24,3);c.fill();c.fillStyle='#fff';c.font='700 8px Fredoka, sans-serif';c.fillText('OPEN',373.5,229);
  c.fillStyle='#f1e4cf';c.fillRect(0,GROUND,W,345);
  const sh=c.createLinearGradient(0,GROUND,0,GROUND+26);sh.addColorStop(0,'rgba(90,60,40,.22)');sh.addColorStop(1,'rgba(90,60,40,0)');
  c.fillStyle=sh;c.fillRect(0,GROUND,W,26);
  plazaGrid(c,'#e0cdb0');
  const lg=c.createRadialGradient(300,420,20,300,420,260);lg.addColorStop(0,'rgba(255,248,215,.45)');lg.addColorStop(1,'rgba(255,248,215,0)');
  c.fillStyle=lg;c.fillRect(0,GROUND,W,345);
  palm(c,22,302,200,10);palm(c,196,304,190,-6);
  c.fillStyle='#fbf5ea';c.fillRect(0,645,W,6);c.fillStyle='#d4c1a2';c.fillRect(0,651,W,7);
  c.fillStyle='#6f7582';c.fillRect(0,658,W,62);
  c.fillStyle='#f7f7f7';for(let x=6;x<W;x+=50)c.fillRect(x,688,26,3);
}

/* ---------- boutique background ---------- */
function drawShopStatic(c){
  c.fillStyle='#fbe3ec';c.fillRect(0,0,W,104);
  // chandelier
  c.strokeStyle='#d9b45a';c.lineWidth=2;c.beginPath();c.moveTo(200,0);c.lineTo(200,30);c.stroke();
  c.fillStyle='#f4c430';c.beginPath();c.ellipse(200,36,34,7,0,0,7);c.fill();
  for(let i=0;i<7;i++){c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(170+i*10,46+(i%2)*4,3,0,7);c.fill()}
  // back wall
  c.fillStyle='#ffd3e2';c.fillRect(0,104,W,196);
  c.fillStyle='#ffffff';c.fillRect(0,100,W,8);
  c.fillStyle='#ffe8f0';c.fillRect(0,250,W,50);
  c.strokeStyle='#f6c3d4';c.lineWidth=2;for(let x=6;x<W;x+=66){rr(c,x,256,56,38,4);c.stroke()}
  // shelf unit for bags
  c.fillStyle='#ffffff';c.fillRect(16,116,180,182);
  c.fillStyle='#f8eef2';c.fillRect(24,124,164,58);c.fillRect(24,190,164,52);
  c.fillStyle='#e9d3dc';c.fillRect(24,182,164,8);c.fillRect(24,242,164,8);
  c.fillStyle='#f3e4ea';c.fillRect(24,256,164,36);
  c.fillStyle='#d9b45a';[66,146].forEach(x=>{c.beginPath();c.arc(x,274,3,0,7);c.fill()});
  c.fillStyle='#d6336c';c.font='600 11px Fredoka, sans-serif';c.textAlign='center';c.fillText('BAGS',106,136);
  // mirror
  c.fillStyle='#d9b45a';rr(c,212,118,84,166,42);c.fill();
  const mg=c.createLinearGradient(220,126,288,276);mg.addColorStop(0,'#f4fbff');mg.addColorStop(.5,'#d6eef8');mg.addColorStop(1,'#eaf6fb');
  c.fillStyle=mg;rr(c,219,125,70,152,35);c.fill();
  c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.moveTo(232,150);c.lineTo(246,136);c.lineTo(250,140);c.lineTo(236,156);c.fill();
  // boutique sign on wall
  c.fillStyle='#6a24b8';c.font='400 26px Lobster, cursive';c.fillText('Bijou',350,150);
  c.fillStyle='#d9b45a';c.fillRect(318,160,64,2);
  // floor: pink and white marble in perspective
  for(let k=0;k<9;k++){const y0=rowY(k),y1=rowY(k+1);
    for(let j=0,bx=-600;bx<1000;bx+=56,j++){
      c.fillStyle=(k+j)%2?'#fff6f9':'#f7dbe6';
      c.beginPath();c.moveTo(lineX(bx,y0),y0);c.lineTo(lineX(bx+56,y0),y0);c.lineTo(lineX(bx+56,y1),y1);c.lineTo(lineX(bx,y1),y1);c.fill();
    }}
  const sh=c.createLinearGradient(0,GROUND,0,GROUND+24);sh.addColorStop(0,'rgba(120,50,80,.18)');sh.addColorStop(1,'rgba(120,50,80,0)');
  c.fillStyle=sh;c.fillRect(0,GROUND,W,24);
  // rug
  c.fillStyle='#c9a6ef';c.beginPath();c.ellipse(205,505,120,40,0,0,7);c.fill();
  c.strokeStyle='#ffffff';c.lineWidth=3;c.beginPath();c.ellipse(205,505,106,33,0,0,7);c.stroke();
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(205,505,40,12,0,0,7);c.fill();
  // plants
  [[26,318],[378,318]].forEach(([x,y])=>{
    c.fillStyle='rgba(120,50,80,.18)';c.beginPath();c.ellipse(x+4,y+2,18,5,0,0,7);c.fill();
    for(let i=0;i<7;i++){const a=-Math.PI/2+(i-3)*.42;c.fillStyle=i%2?'#3fae6a':'#2f9157';c.beginPath();c.ellipse(x+Math.cos(a)*16,y-30+Math.sin(a)*16,6,15,a+Math.PI/2,0,7);c.fill()}
    c.fillStyle='#ffffff';c.beginPath();c.moveTo(x-12,y-18);c.lineTo(x+12,y-18);c.lineTo(x+9,y);c.lineTo(x-9,y);c.fill();
    c.fillStyle='#d9b45a';c.fillRect(x-12,y-18,24,3);
  });
  // entrance
  c.fillStyle='#e9c9d6';c.fillRect(0,645,W,75);
  c.fillStyle='#6a24b8';rr(c,140,660,120,30,8);c.fill();
  c.fillStyle='#ffd84a';c.font='400 17px Lobster, cursive';c.textAlign='center';c.fillText('Welcome',200,681);c.textAlign='left';
}

/* ---------- items ---------- */
function drawBag(c,cx,cy,s,b){
  c.save();c.translate(cx,cy);c.scale(s,s);c.lineJoin='round';
  const ol=()=>{c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1.5;c.stroke()};
  c.strokeStyle=b.trim==='#ffffff'?'#d9b8c8':b.trim;c.lineWidth=3;
  if(b.shape==='clutch'){
    rr(c,-20,-10,40,22,5);c.fillStyle=b.color;c.fill();ol();
    c.beginPath();c.moveTo(-20,-9);c.lineTo(20,-9);c.lineTo(0,5);c.closePath();c.fillStyle=b.trim;c.fill();ol();
    c.fillStyle='#f4c430';c.beginPath();c.arc(0,4,3,0,7);c.fill();
  }else if(b.shape==='round'){
    c.beginPath();c.arc(0,4,17,Math.PI*1.08,Math.PI*1.92);c.stroke();
    c.beginPath();c.arc(0,8,15,0,7);c.fillStyle=b.color;c.fill();ol();
    c.beginPath();c.arc(0,8,9,0,7);c.strokeStyle=b.trim;c.lineWidth=2;c.stroke();
  }else if(b.shape==='tote'){
    c.beginPath();c.arc(-7,-6,7,Math.PI,0);c.stroke();c.beginPath();c.arc(7,-6,7,Math.PI,0);c.stroke();

/* ---------- logic ---------- */
function spawnPerson(){
  const dir=Math.random()<.5?1:-1,back=Math.random()<.3;
  people.push({x:dir>0?-30:W+30,y:back?318+Math.random()*30:548+Math.random()*44,dir,speed:(40+Math.random()*24)*(back?.75:1),ph:Math.random()*6,
    wants:!back&&Math.random()<.6,asked:false,state:'walk',slot:null,pat:0,patMax:14,mood:'ok',cup:false,look:randLook()});
}
function leave(p){if(p.slot){p.slot.p=null;p.slot=null}p.state='leave'}
function serve(p){
  if(girl.mode!=='stand'){say('Lili is away at the boutique!');return}
  if(refill.on){say('One moment, squeezing lemons...');return}
  if(cups<=0){say('The pitcher is empty. Make lemonade!');pitcherFlash=.5;return}
  cups--;const tip=p.pat/p.patMax>.6?1:0,earn=PRICE+tip;S.money+=earn;S.served++;save();
  parts.push({x:p.x,y:p.y-95,vy:-38,life:1.3,text:'+$'+earn+(tip?' tip!':''),col:'#2b9348'});
  for(let i=0;i<4;i++)parts.push({x:p.x+(Math.random()-.5)*20,y:p.y-80,vy:-60-Math.random()*40,vx:(Math.random()-.5)*50,life:.9,coin:true});
  p.cup=true;p.mood='happy';dog.wag=1.2;leave(p);updateButtons();
}
function startRefill(){
  if(girl.mode!=='stand'){say('Lili is away at the boutique!');return}
  if(refill.on)return;
  if(cups===MAXCUPS){say('The pitcher is already full.');return}
  if(S.money>=1){S.money-=1;save();parts.push({x:205,y:350,vy:-30,life:1,text:'-$1',col:'#ef476f'})}
  refill={on:true,t:1.6};say('Squeezing lemons...',1.6);updateButtons();
}
function walkTo(points,cb){girl.path=points.slice();girl.onArrive=cb}
function goShop(){
  if(girl.mode!=='stand'||refill.on)return;
  girl.mode='toShop';walkTo([{x:252,y:420},{x:335,y:306}],enterShop);updateButtons();
}
function enterShop(){
  scene='shop';girl.mode='shop';girl.x=200;girl.y=700;girl.dir=1;
  walkTo([{x:200,y:600}],null);keeper={say:'Welcome to Bijou, Lili!',t:2.6};
  say('Tap anything you like!',2.6);updateButtons();
}
function leaveShop(){
  closeCard();girl.mode='leaving';
  walkTo([{x:200,y:705}],()=>{
    scene='street';girl.mode='back';girl.x=335;girl.y=306;
    walkTo([{x:252,y:420},{x:150,y:420}],()=>{girl.mode='stand';girl.dir=1;updateButtons()});
    updateButtons();
  });
  updateButtons();
}
function tapItem(it){
  closeCard();cardItem=it;const sp=SPOT[it.cat];
  walkTo([{x:sp.x,y:sp.y}],()=>{girl.dir=1;openCard(it)});
}
function update(dt){
  time+=dt;
  clouds.forEach(cl=>{cl.x+=cl.v*dt;if(cl.x>W+40)cl.x=-90});
  birds.forEach(b=>{b.x+=b.v*dt;if(b.x>W+30)b.x=-30});
  if(hint.t>0)hint.t-=dt;if(pitcherFlash>0)pitcherFlash-=dt;if(dog.wag>0)dog.wag-=dt;if(keeper.t>0)keeper.t-=dt;
  if(refill.on){refill.t-=dt;if(refill.t<=0){refill.on=false;cups=MAXCUPS;say('Fresh lemonade!',1.4);updateButtons()}}
  spawnT-=dt;if(spawnT<=0&&people.length<10){spawnPerson();spawnT=1.2+Math.random()*1.5}
  carT-=dt;if(carT<=0){const d=Math.random()<.5?1:-1;cars.push({x:d>0?-60:W+60,dir:d,y:d>0?676:704,v:130+Math.random()*60,color:pick(['#ff5d8f','#2ec4b6','#ffd23f','#ffffff','#7b8cff','#ff9f68']),skin:pick(SKIN)});carT=4+Math.random()*5}
  cars.forEach(k=>k.x+=k.dir*k.v*dt);cars=cars.filter(k=>k.x>-80&&k.x<W+80);
  for(const p of people){
    if(p.state==='walk'||p.state==='leave'){
      p.x+=p.dir*p.speed*dt;p.ph+=dt*p.speed*.16;
      if(p.state==='leave'&&p.ty!=null){p.y+=(p.ty-p.y)*Math.min(1,dt*2)}
      if(p.state==='walk'&&p.wants&&!p.asked&&Math.abs(p.x-150)<170){
        p.asked=true;const free=slots.filter(s=>!s.p);
        if(free.length){free.sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x));p.slot=free[0];free[0].p=p;p.state='toSlot';p.ty=p.y}
      }
    }else if(p.state==='toSlot'){
      const dx=p.slot.x-p.x,dy=528-p.y,d=Math.hypot(dx,dy);
      if(d<2){p.x=p.slot.x;p.y=528;p.state='wait';p.pat=p.patMax}
      else{const v=p.speed*1.15*dt;p.x+=dx/d*Math.min(v,d);p.y+=dy/d*Math.min(v,d);p.ph+=dt*p.speed*.16}
    }else if(p.state==='wait'){
      p.pat-=dt;if(p.pat<=0){p.mood='sad';leave(p);parts.push({x:p.x,y:p.y-90,vy:-25,life:1,text:'Hmph!',col:'#ef476f',scene:'street'})}
    }
  }
  people=people.filter(p=>p.x>-50&&p.x<W+50);
  if(girl.path.length){
    const t=girl.path[0],dx=t.x-girl.x,dy=t.y-girl.y,d=Math.hypot(dx,dy);girl.ph+=dt*14;
    if(Math.abs(dx)>1)girl.dir=Math.sign(dx);
    if(d<3){girl.x=t.x;girl.y=t.y;girl.path.shift();
      if(!girl.path.length&&girl.onArrive){const f=girl.onArrive;girl.onArrive=null;f()}}
    else{const v=100*dt;girl.x+=dx/d*Math.min(v,d);girl.y+=dy/d*Math.min(v,d)}
  }
  parts.forEach(q=>{q.life-=dt;q.y+=q.vy*dt;if(q.vx)q.x+=q.vx*dt;if(q.coin)q.vy+=120*dt});
  parts=parts.filter(q=>q.life>0);
  sparkles.forEach(q=>{q.life-=dt;q.y-=14*dt});sparkles=sparkles.filter(q=>q.life>0);
}
function drawParts(){
  parts.forEach(q=>{
    if((q.scene||'street')!==scene&&!q.any)return;
    ctx.globalAlpha=Math.min(1,q.life*1.5);
    if(q.coin){ctx.fillStyle='#f4c430';ctx.beginPath();ctx.arc(q.x,q.y,4.5,0,7);ctx.fill();ctx.strokeStyle='#c99a00';ctx.lineWidth=1;ctx.stroke()}
    else{ctx.font='700 16px Fredoka, sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(q.text,q.x,q.y);ctx.fillStyle=q.col;ctx.fillText(q.text,q.x,q.y);ctx.textAlign='left'}
    ctx.globalAlpha=1;
  });
  sparkles.forEach(q=>{ctx.globalAlpha=Math.min(1,q.life*2);ctx.fillStyle=q.col;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(time*3);
    ctx.beginPath();for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.moveTo(0,0);ctx.lineTo(1.6,-1.6);ctx.lineTo(0,-6);ctx.lineTo(-1.6,-1.6);ctx.closePath()}ctx.fill();ctx.restore();ctx.globalAlpha=1});
}
function burst(x,y,n=12){for(let i=0;i<n;i++)sparkles.push({x:x+(Math.random()-.5)*50,y:y+(Math.random()-.5)*50,life:.6+Math.random()*.6,col:pick(['#ffd84a','#ff8fab','#ffffff','#b388eb'])})}
function renderStreet(){
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bgStreet,0,0);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  clouds.forEach(drawCloud);
  ctx.strokeStyle='#3a5a7a';ctx.lineWidth=1.4;birds.forEach(b=>{const f=Math.sin(time*8+b.x)*3;ctx.beginPath();ctx.moveTo(b.x-5,b.y-f);ctx.lineTo(b.x,b.y);ctx.lineTo(b.x+5,b.y-f);ctx.stroke()});
  drawWindowItems();
  const gl=girlLook(),gb=S.wear.bag?byId(S.wear.bag):null;
  const items=[];
  people.forEach(p=>items.push({y:p.y,d:()=>{drawPersonAt(p.x,p.y,p.look,p.ph,p.state!=='wait',p.dir,p.mood,p.cup,null);if(p.state==='wait')drawBubble(p)}}));
  items.push({y:398,d:drawStandBack});
  items.push({y:420.5,d:drawStandFront});
  if(girl.mode==='stand')items.push({y:420,d:()=>drawPersonAt(girl.x,420+Math.sin(time*2)*.6,gl,0,false,1,'happy',false,null)});
  else if(girl.mode==='toShop'||girl.mode==='back')items.push({y:girl.y+(girl.y>418?1:0),d:()=>drawPersonAt(girl.x,girl.y,gl,girl.ph,true,girl.dir,'happy',false,gb)});
  items.push({y:dog.y,d:drawDog});
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.d());
  cars.forEach(drawCar);
}
function renderShop(){
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bgShop,0,0);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  drawShopBags();
  const gl=girlLook(),gb=S.wear.bag?byId(S.wear.bag):null,walking=girl.path.length>0;
  const items=[
    {y:291,d:()=>drawPersonAt(352,291,KEEPER,0,false,-1,'happy',false,null)},
    {y:305,d:drawDesk},{y:390,d:drawRack},{y:452,d:drawPedestal},{y:522,d:drawHatStand},{y:598,d:drawPodium},
    {y:girl.y,d:()=>drawPersonAt(girl.x,girl.y,gl,girl.ph,walking,girl.dir,'happy',false,gb)}
  ];
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.d());
  if(keeper.t>0)speech(352,226,keeper.say);
}
function render(){scene==='street'?renderStreet():renderShop();drawParts();drawHUD()}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(scene==='shop'){
    if(girl.mode!=='shop')return;
    let best=null,bd=26;
    ITEMS.forEach(it=>{const ce=itemCenter(it),d=Math.hypot(ce.x-x,ce.y-y);if(d<bd){bd=d;best=it}});
    if(best)return tapItem(best);
    if(x>212&&x<296&&y>118&&y<284){closeCard();walkTo([{x:254,y:322}],()=>{keeper={say:'Looking fabulous!',t:2};burst(254,200,16)});return}
    if(x>310&&y>220&&y<305){keeper={say:pick(['Welcome to Bijou!','New styles every week!','You have great taste!']),t:2};return}
    if(y>640){return leaveShop()}
    if(y>300&&y<640){closeCard();walkTo([{x:Math.max(20,Math.min(380,x)),y:Math.max(320,y)}],null)}
    return;
  }
  const waiting=people.filter(p=>p.state==='wait');
  const hit=waiting.find(p=>Math.abs(p.x-x)<22&&y<p.y+6&&y>p.y-118);
  if(hit)return serve(hit);
  if(x>185&&x<228&&y>365&&y<422)return startRefill();
  if(Math.hypot(x-dog.x,y-dog.y+12)<20){dog.wag=1.5;return say('Woof woof!',1)}
  if(x>206&&y>96&&y<305&&girl.mode==='stand')return goShop();
  if(x<260&&y>280&&y<610&&waiting.length){waiting.sort((a,b)=>a.pat-b.pat);serve(waiting[0])}
});

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const refillBtn=$('refillBtn'),shopBtn=$('shopBtn'),leaveBtn=$('leaveBtn'),card=$('itemCard');
refillBtn.onclick=startRefill;shopBtn.onclick=goShop;leaveBtn.onclick=leaveShop;$('icClose').onclick=closeCard;
function updateButtons(){
  const inShop=scene==='shop';
  refillBtn.hidden=shopBtn.hidden=inShop;leaveBtn.hidden=!inShop;
  leaveBtn.disabled=girl.mode==='leaving';
  const busy=girl.mode!=='stand';
  refillBtn.disabled=busy||refill.on;shopBtn.disabled=busy||refill.on;
  refillBtn.textContent=S.money>=1?'Make lemonade · $1':'Make lemonade · free';
}
function openCard(it){
  cardItem=it;
  const c=$('itemCv').getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,240,192);c.setTransform(2,0,0,2,0,0);
  if(it.cat==='dress')drawDress(c,60,6,1.4,it);else drawItem(c,it,60,50,it.cat==='bag'?1.5:it.cat==='glasses'?2.2:it.cat==='hat'?2:2.2);
  $('icCat').textContent=CATS[it.cat];$('icName').textContent=it.name;
  const own=S.owned.includes(it.id),worn=S.wear[it.cat]===it.id,b=$('icBuy');
  $('icPrice').textContent=own?(worn?'Lili is wearing this':'In Lili\'s closet'):'$'+it.price;
  b.disabled=false;
  if(!own){
    if(S.money>=it.price){b.className='btn b-pink';b.textContent='Buy for $'+it.price;b.onclick=()=>buy(it)}
    else{b.className='btn b-pink';b.textContent='Need $'+(it.price-S.money)+' more';b.disabled=true}
  }else if(worn){b.className='btn b-ghost';b.textContent='Take it off';b.onclick=()=>{delete S.wear[it.cat];save();openCard(it)}}
  else{b.className='btn b-mint';b.textContent='Wear it';b.onclick=()=>{S.wear[it.cat]=it.id;save();burst(girl.x,girl.y-50,10);openCard(it)}}
  card.hidden=false;
}
function closeCard(){card.hidden=true;cardItem=null}
function buy(it){
  if(S.money<it.price)return;
  S.money-=it.price;S.owned.push(it.id);S.wear[it.cat]=it.id;save();
  parts.push({x:girl.x,y:girl.y-90,vy:-30,life:1.4,text:'-$'+it.price,col:'#d6336c',scene:'shop'});
  burst(girl.x,girl.y-50,18);keeper={say:pick(['Great choice!','It suits you!','So chic!']),t:2};
  openCard(it);
}

function resize(){
  const st=$('stage'),cs=getComputedStyle(st);
  const aw=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=st.clientHeight-16;
  scale=Math.min(aw/W,ah/H);dpr=Math.min(window.devicePixelRatio||1,2);
  const wrap=$('wrap');wrap.style.width=W*scale+'px';wrap.style.height=H*scale+'px';
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  const pw=Math.round(W*scale*dpr),ph=Math.round(H*scale*dpr);
  [cv,bgStreet,bgShop].forEach(c=>{c.width=pw;c.height=ph});
  const a=bgStreet.getContext('2d'),b=bgShop.getContext('2d');
  a.setTransform(scale*dpr,0,0,scale*dpr,0,0);drawStreetStatic(a);
  b.setTransform(scale*dpr,0,0,scale*dpr,0,0);drawShopStatic(b);
}
window.addEventListener('resize',resize);
resize();updateButtons();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize);
requestAnimationFrame(loop);
