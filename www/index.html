<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E3B47">
<title>Whizzbang Workshop</title>
<style>
@font-face{font-family:'Fredoka';src:url('fonts/Fredoka.ttf') format('truetype');font-weight:300 700;font-display:block}
html,body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one portrait screen: workshop wall on top, customer and machine in the middle, parts shelf at the bottom */
:root{
  --wall:#1E3B47; --wall-2:#285161; --wood:#8B5B3A; --wood-dark:#5C3A24;
  --brass:#E9B04F; --mint:#8ED8BF; --ink:#F6EFE0; --ink-dim:#BFD0D3; --danger:#EF7A62;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Fredoka",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.08) 58px 60px),
             radial-gradient(ellipse at 50% 20%,rgba(233,176,79,.16),transparent 60%)}
.app{position:relative;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;z-index:1;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}

/* Start */
.start{justify-content:center;align-items:center;text-align:center;gap:18px;padding-block:20px}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,58px);line-height:.9;margin:0;color:var(--brass);
  text-shadow:0 3px 0 var(--wood-dark),0 6px 18px rgba(0,0,0,.35);text-wrap:balance}
.logo small{display:block;font-size:.42em;color:var(--mint);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;text-shadow:none}
.crew{display:flex;justify-content:center;align-items:flex-end;gap:2px;width:100%}
.crew figure{margin:0;width:24%;display:flex;flex-direction:column;align-items:center}
.crew svg{width:100%;height:auto}
.crew figcaption{font-size:11px;font-weight:700;color:var(--ink-dim);line-height:1.15;margin-top:2px}
.lead{max-width:34ch;margin:0;color:var(--ink-dim);font-size:15px;line-height:1.45}
.big{background:var(--brass);color:#3A2410;border:0;border-radius:16px;padding:14px 38px;font-family:var(--display);
  font-weight:700;font-size:24px;box-shadow:0 5px 0 #9C6A1F;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #9C6A1F}
.best{font-size:13px;color:var(--ink-dim)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding-block:10px 6px;font-weight:700}
.chip{background:rgba(0,0,0,.25);border-radius:999px;padding:5px 12px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--brass)}
.lives{display:flex;gap:3px;margin-left:auto}
.lives span{width:18px;height:18px;border-radius:50%;background:var(--mint);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.lives span.off{background:rgba(255,255,255,.12);box-shadow:none}
.timer{height:10px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--mint);transform-origin:left;transition:background .3s}
.timer.low i{background:var(--danger)}

/* Stage */
.stage{flex:1;display:flex;align-items:flex-end;gap:6px;min-height:0;padding-top:70px;position:relative}
.sign{position:absolute;top:18px;left:50%;transform:translateX(-50%) rotate(-2deg);background:var(--wood);color:#F3D9B5;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px;border-radius:8px;box-shadow:0 3px 0 var(--wood-dark);white-space:nowrap}
.sign::before,.sign::after{content:"";position:absolute;top:-16px;width:2px;height:16px;background:#8FA1AA}
.sign::before{left:18px}.sign::after{right:18px}
.customer{width:42%;max-width:min(190px,24vh);flex:none;position:relative}
.customer svg{width:100%;height:auto;display:block}
.bubble{position:absolute;left:30%;right:-6px;top:-4px;transform:translateY(-100%);background:var(--ink);color:#2B2620;
  border-radius:14px;padding:8px 10px;font-size:13px;line-height:1.25;font-weight:700;z-index:3;min-width:150px}
.bubble::after{content:"";position:absolute;left:18px;bottom:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble em{font-style:normal;color:#A0571E}
.machine{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;padding-bottom:4px}
.machine .body{width:100%;max-width:250px;height:auto;display:block}
.slots{position:absolute;left:50%;transform:translateX(-50%);bottom:22%;display:flex;gap:4px;width:86%;max-width:190px;justify-content:center;flex-wrap:wrap}
.slot{width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.35);border:2px dashed rgba(246,239,224,.35);display:grid;place-items:center}
.slot svg{width:30px;height:30px;opacity:.28;filter:grayscale(1)}
.slot.done{border:2px solid var(--brass);background:rgba(233,176,79,.18)}
.slot.done svg{opacity:1;filter:none}
.steam{position:absolute;top:2%;left:24%;width:14px;height:14px;border-radius:50%;background:#fff;opacity:0}
.machine.alive .body{animation:wobble .25s ease-in-out infinite alternate}
.machine.alive .slot.done svg{animation:spin .6s linear infinite}
.machine.alive .steam{animation:puff 1s ease-out infinite}
.machine.alive .steam:nth-of-type(2){animation-delay:.33s;left:27%}
.machine.alive .steam:nth-of-type(3){animation-delay:.66s;left:21%}
.machine.alive .lamp{fill:#FFE68A}
@keyframes wobble{from{transform:rotate(-2deg) scale(1)}to{transform:rotate(2deg) scale(1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes puff{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-10px,-60px) scale(2.2)}}

/* Characters */
.char .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.char{animation:bob 2.4s ease-in-out infinite;transform-origin:bottom center}
.customer.cheer svg{animation:jump .45s ease-out 3}
.customer.sad svg{animation:none;transform:rotate(-6deg) translateY(6px);filter:saturate(.5)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(4deg)}}

/* Shelf */
.shelf{background:linear-gradient(var(--wood),var(--wood-dark));border-radius:14px 14px 0 0;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));
  margin-inline:-6px;box-shadow:0 -4px 0 #A87047 inset, 0 -6px 18px rgba(0,0,0,.3)}
.shelf h2{margin:0 0 8px;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F3D9B5}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:8px}
.part{height:clamp(56px,12.5vh,118px);max-width:100%;border:0;border-radius:14px;background:#F3E6CF;box-shadow:0 4px 0 #B89466;display:grid;place-items:center;padding:8%;transition:transform .08s,opacity .2s}
.part svg{width:100%;height:100%}
.part:active{transform:translateY(3px);box-shadow:0 1px 0 #B89466}
.part.used{opacity:.15;pointer-events:none}
.part.wrong{animation:shake .35s;background:#F6C3B6}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.flyer{position:fixed;z-index:50;pointer-events:none;transition:transform .45s cubic-bezier(.4,1.4,.6,1)}
.flyer svg{width:100%;height:100%}

.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-family:var(--display);font-weight:700;
  font-size:34px;color:var(--brass);text-shadow:0 3px 0 var(--wood-dark);z-index:60;pointer-events:none;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.over{justify-content:center;align-items:center;text-align:center;gap:14px}
.over h2{font-family:var(--display);font-size:40px;margin:0;color:var(--brass)}
.over p{margin:0;color:var(--ink-dim);font-size:16px}
.score{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
@media (max-height:760px){.sign{display:none}.stage{padding-top:64px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <section class="screen start" id="start">
    <h1 class="logo"><small>build · fix · amaze</small>Whizzbang Workshop</h1>
    <div class="crew" id="crew"></div>
    <p class="lead">Your workshop friends want wonderfully odd machines. Check what each one needs, then tap the right parts on the shelf before time runs out.</p>
    <button class="big" id="play">Play</button>
    <div class="best" id="bestLine"></div>
  </section>

  <section class="screen" id="game" hidden>
    <div class="hud">
      <span class="chip">Level <b id="lvl">1</b></span>
      <span class="chip">Coins <b id="coins">0</b></span>
      <div class="lives" id="lives" aria-label="Lives"></div>
    </div>
    <div class="timer" id="timer"><i id="timeBar"></i></div>
    <div class="stage">
      <div class="sign" aria-hidden="true">Whizzbang Workshop</div>
      <div class="customer" id="customer">
        <div class="bubble" id="bubble"></div>
        <div id="custSvg"></div>
      </div>
      <div class="machine" id="machine">
        <span class="steam"></span><span class="steam"></span><span class="steam"></span>
        <svg class="body" viewBox="0 0 200 190" aria-hidden="true">
          <rect x="40" y="10" width="22" height="46" rx="4" fill="#6E7F88"/>
          <rect x="36" y="8" width="30" height="10" rx="4" fill="#8FA1AA"/>
          <rect x="14" y="48" width="172" height="118" rx="22" fill="#C9773F"/>
          <rect x="14" y="48" width="172" height="20" rx="10" fill="#DE8E53"/>
          <circle class="lamp" cx="160" cy="36" r="12" fill="#6B6252" stroke="#8FA1AA" stroke-width="4"/>
          <rect x="155" y="46" width="10" height="8" fill="#8FA1AA"/>
          <circle cx="34" cy="84" r="5" fill="#8B4B22"/><circle cx="166" cy="84" r="5" fill="#8B4B22"/>
          <circle cx="34" cy="150" r="5" fill="#8B4B22"/><circle cx="166" cy="150" r="5" fill="#8B4B22"/>
          <rect x="30" y="166" width="20" height="18" rx="4" fill="#5C3A24"/><rect x="150" y="166" width="20" height="18" rx="4" fill="#5C3A24"/>
        </svg>
        <div class="slots" id="slots"></div>
      </div>
    </div>
    <div class="shelf">
      <h2>Parts shelf</h2>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="screen over" id="over" hidden>
    <h2>Workshop closed!</h2>
    <p>You earned</p>
    <div class="score" id="final">0</div>
    <p id="overNote">coins</p>
    <button class="big" id="again">Play again</button>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- Characters ----------
const EYES = (x1,x2,y)=>`<g class="eyes"><circle cx="${x1}" cy="${y}" r="5" fill="#1C1A1A"/><circle cx="${x2}" cy="${y}" r="5" fill="#1C1A1A"/><circle cx="${x1+1.8}" cy="${y-1.8}" r="1.7" fill="#fff"/><circle cx="${x2+1.8}" cy="${y-1.8}" r="1.7" fill="#fff"/></g>`;
const CHARS = {
  zupcic:{name:"Master Gearbit", svg:`<svg class="char" viewBox="0 0 120 150"><path d="M22 150Q22 100 60 100Q98 100 98 150Z" fill="#3E7C8C"/><path d="M38 108h44v42H38z" fill="#9A633C"/><rect x="54" y="118" width="12" height="9" rx="2" fill="#7A4C2C"/><circle cx="60" cy="64" r="34" fill="#F1B88B"/><path d="M27 52Q30 26 60 28Q90 26 93 52Q80 40 60 40Q40 40 27 52Z" fill="#6B4428"/><rect x="26" y="38" width="68" height="8" rx="4" fill="#3B302A"/><circle cx="46" cy="42" r="9" fill="#A6DCE8" stroke="#D08F3B" stroke-width="4"/><circle cx="74" cy="42" r="9" fill="#A6DCE8" stroke="#D08F3B" stroke-width="4"/>${EYES(48,72,66)}<circle cx="60" cy="74" r="5" fill="#E2966A"/><path d="M44 83Q52 76 60 82Q68 76 76 83Q68 90 60 85Q52 90 44 83Z" fill="#6B4428"/><circle cx="38" cy="76" r="5" fill="#F09A86" opacity=".5"/><circle cx="82" cy="76" r="5" fill="#F09A86" opacity=".5"/></svg>`},
  opruga:{name:"Auntie Coil", svg:`<svg class="char" viewBox="0 0 120 150"><path d="M26 150Q26 100 60 100Q94 100 94 150Z" fill="#9C4C7E"/><path d="M40 104Q46 132 42 150M80 104Q74 132 78 150" stroke="#F2C94C" stroke-width="7" fill="none"/><path d="M41 120h4M41 130h4M75 120h4M75 130h4" stroke="#6D5A1E" stroke-width="2"/><circle cx="60" cy="24" r="14" fill="#C9CED6"/><path d="M50 14L74 32" stroke="#F2C94C" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="66" r="32" fill="#E9A57D"/><path d="M28 62Q30 34 60 34Q90 34 92 62Q84 48 60 48Q36 48 28 62Z" fill="#C9CED6"/>${EYES(47,73,68)}<circle cx="47" cy="68" r="11" fill="none" stroke="#2A2A2A" stroke-width="3"/><circle cx="73" cy="68" r="11" fill="none" stroke="#2A2A2A" stroke-width="3"/><path d="M58 68h4" stroke="#2A2A2A" stroke-width="3"/><path d="M50 84Q60 92 70 84" stroke="#7A2F3A" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`},
  cajnik:{name:"Captain Teapot", svg:`<svg class="char" viewBox="0 0 120 150"><path d="M18 150Q18 98 60 98Q102 98 102 150Z" fill="#26406B"/><circle cx="50" cy="118" r="3" fill="#E9B04F"/><circle cx="50" cy="132" r="3" fill="#E9B04F"/><rect x="74" y="112" width="20" height="22" rx="4" fill="#F6EFE0"/><path d="M94 116q8 0 8 7t-8 7" stroke="#F6EFE0" stroke-width="4" fill="none"/><circle cx="60" cy="68" r="33" fill="#F0B48C"/><path d="M28 72Q30 112 60 112Q90 112 92 72Q86 90 60 92Q34 90 28 72Z" fill="#EDEDED"/><path d="M26 44Q60 18 94 44L94 48L26 48Z" fill="#F6EFE0"/><rect x="26" y="46" width="68" height="10" fill="#26406B"/><path d="M30 56Q60 66 90 56L90 60Q60 70 30 60Z" fill="#14233D"/><circle cx="60" cy="38" r="5" fill="#E9B04F"/>${EYES(48,72,70)}<ellipse cx="60" cy="80" rx="6" ry="5" fill="#E08E66"/><path d="M50 92Q60 98 70 92" stroke="#B9B9B9" stroke-width="3" fill="none"/></svg>`},
  sraf:{name:"Little Bolt", svg:`<svg class="char" viewBox="0 0 120 150"><path d="M32 150Q32 108 60 108Q88 108 88 150Z" fill="#E6C247"/><rect x="44" y="108" width="6" height="42" fill="#3E6FB0"/><rect x="70" y="108" width="6" height="42" fill="#3E6FB0"/><circle cx="60" cy="80" r="28" fill="#F3C19B"/><path d="M32 72Q34 48 60 48Q86 48 88 72Z" fill="#D9493A"/><path d="M34 70Q20 72 14 66Q22 62 36 64Z" fill="#B23628"/><circle cx="60" cy="50" r="4" fill="#B23628"/>${EYES(50,70,82)}<g fill="#C98A5E"><circle cx="44" cy="90" r="1.6"/><circle cx="48" cy="93" r="1.6"/><circle cx="72" cy="93" r="1.6"/><circle cx="76" cy="90" r="1.6"/></g><path d="M50 96Q60 106 70 96Z" fill="#7A2F3A"/><rect x="57" y="96" width="6" height="4" fill="#fff"/></svg>`}
};
const CHAR_IDS = Object.keys(CHARS);

// ---------- Parts ----------
function gearPath(cx,cy,r,teeth){let d="";for(let i=0;i<teeth*2;i++){const a=i*Math.PI/teeth,rr=i%2?r:r+7;const a2=a+Math.PI/teeth;d+=(i?"L":"M")+(cx+rr*Math.cos(a)).toFixed(1)+" "+(cy+rr*Math.sin(a)).toFixed(1)+"L"+(cx+rr*Math.cos(a2)).toFixed(1)+" "+(cy+rr*Math.sin(a2)).toFixed(1);}return d+"Z";}
const S = b=>`<svg viewBox="0 0 64 64">${b}</svg>`;
const PARTS = {
  gear:{name:"gear",svg:S(`<path d="${gearPath(32,32,19,8)}" fill="#E9B04F" stroke="#9C6A1F" stroke-width="2"/><circle cx="32" cy="32" r="7" fill="#F3E6CF" stroke="#9C6A1F" stroke-width="2"/>`)},
  spring:{name:"spring",svg:S(`<path d="M18 10H46L18 20L46 30L18 40L46 50L18 54H46" fill="none" stroke="#7B8C96" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`)},
  bolt:{name:"bolt",svg:S(`<path d="M22 8H42L48 18L42 26H22L16 18Z" fill="#9AAAB4" stroke="#56656E" stroke-width="2"/><rect x="27" y="26" width="10" height="30" fill="#B9C4CC" stroke="#56656E" stroke-width="2"/><path d="M27 32l10 4M27 40l10 4M27 48l10 4" stroke="#56656E" stroke-width="2"/>`)},
  wheel:{name:"wheel",svg:S(`<circle cx="32" cy="32" r="24" fill="#3B3633"/><circle cx="32" cy="32" r="15" fill="#D2814F"/><path d="M32 17V47M17 32H47M21 21L43 43M43 21L21 43" stroke="#8B4B22" stroke-width="3"/><circle cx="32" cy="32" r="5" fill="#F3E6CF"/>`)},
  prop:{name:"propeller",svg:S(`<g fill="#5FB7A0" stroke="#2F7A66" stroke-width="2"><ellipse cx="32" cy="16" rx="7" ry="15"/><ellipse cx="32" cy="16" rx="7" ry="15" transform="rotate(120 32 32)"/><ellipse cx="32" cy="16" rx="7" ry="15" transform="rotate(240 32 32)"/></g><circle cx="32" cy="32" r="6" fill="#E9B04F" stroke="#9C6A1F" stroke-width="2"/>`)},
  bulb:{name:"light bulb",svg:S(`<circle cx="32" cy="26" r="17" fill="#FFE68A" stroke="#C9A43A" stroke-width="2"/><path d="M27 30l5-6 5 6" fill="none" stroke="#C9A43A" stroke-width="2"/><rect x="24" y="42" width="16" height="12" rx="2" fill="#9AAAB4" stroke="#56656E" stroke-width="2"/><path d="M24 47h16" stroke="#56656E" stroke-width="2"/>`)},
  magnet:{name:"magnet",svg:S(`<path d="M14 12V34A18 18 0 0 0 50 34V12" fill="none" stroke="#D9493A" stroke-width="12"/><rect x="8" y="8" width="12" height="10" fill="#C9CED6"/><rect x="44" y="8" width="12" height="10" fill="#C9CED6"/>`)},
  pipe:{name:"pipe",svg:S(`<path d="M10 20H34A12 12 0 0 1 46 32V56" fill="none" stroke="#C9773F" stroke-width="12"/><rect x="6" y="12" width="8" height="16" rx="2" fill="#8B4B22"/><rect x="38" y="50" width="16" height="8" rx="2" fill="#8B4B22"/>`)},
  lever:{name:"lever",svg:S(`<rect x="12" y="44" width="40" height="12" rx="4" fill="#5C3A24"/><path d="M32 46L44 14" stroke="#7B8C96" stroke-width="5" stroke-linecap="round"/><circle cx="45" cy="12" r="8" fill="#D9493A" stroke="#8E2A1F" stroke-width="2"/>`)},
  funnel:{name:"funnel",svg:S(`<path d="M8 12H56L38 34V54H26V34Z" fill="#8ED8BF" stroke="#2F7A66" stroke-width="2" stroke-linejoin="round"/><path d="M8 12H56" stroke="#2F7A66" stroke-width="5"/>`)}
};
const PART_IDS = Object.keys(PARTS);
const MACHINES = ["a tea-making machine","a flying sock finder","an alarm clock that sings","a pancake robot","a helicopter umbrella","a cat-brushing gadget","a good-morning bell","a dream-reading lamp","a mustache dryer","a cookie train","a bubble pump","a clock that runs backwards"];

// ---------- Sound ----------
let ac=null;
function tone(f,d=.12,type="square",v=.06){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

// ---------- State ----------
const $=id=>document.getElementById(id);
let st={};
let best=0; try{best=+localStorage.getItem("ww-best")||0}catch(e){}
function showBest(){$("bestLine").textContent=best?`Best score: ${best} coins`:"";}
const rand=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

$("crew").innerHTML=CHAR_IDS.map(id=>`<figure>${CHARS[id].svg}<figcaption>${CHARS[id].name}</figcaption></figure>`).join("");
showBest();

function show(id){["start","game","over"].forEach(s=>$(s).hidden=s!==id)}

function startGame(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  st={level:1,coins:0,lives:3,running:false};
  show("game");nextOrder();
}
function renderHud(){
  $("lvl").textContent=st.level;$("coins").textContent=st.coins;
  $("lives").innerHTML=[0,1,2].map(i=>`<span class="${i<st.lives?"":"off"}"></span>`).join("");
}
function nextOrder(){
  const lv=st.level;
  const nNeed=Math.min(2+Math.floor((lv-1)/2),5);
  const cells=lv<3?9:12;
  st.total=Math.max(8,20-lv*1.2); st.time=st.total;
  st.need=shuffle([...PART_IDS]).slice(0,nNeed);
  st.got=[];
  let others=PART_IDS.filter(p=>!st.need.includes(p));
  let pool=[...st.need];
  while(pool.length<cells) pool.push(rand(others));
  st.shelf=shuffle(pool);
  st.cust=rand(CHAR_IDS.filter(c=>c!==st.cust));
  st.machine=rand(MACHINES);
  const c=$("customer");c.className="customer";
  $("custSvg").innerHTML=CHARS[st.cust].svg;
  $("bubble").innerHTML=`<span>${CHARS[st.cust].name}:</span><br>Please build me <em>${st.machine}</em>!`;
  $("machine").classList.remove("alive");
  $("slots").innerHTML=st.need.map(p=>`<div class="slot" data-p="${p}">${PARTS[p].svg}</div>`).join("");
  $("grid").style.setProperty("--cols",cells===9?3:4);
  $("grid").innerHTML=st.shelf.map((p,i)=>`<button class="part" id="part-${i}" data-p="${p}" aria-label="${PARTS[p].name}">${PARTS[p].svg}</button>`).join("");
  renderHud();
  st.running=true;st.last=performance.now();requestAnimationFrame(loop);
}
function loop(t){
  if(!st.running)return;
  const dt=(t-st.last)/1000;st.last=t;st.time-=dt;
  const f=Math.max(0,st.time/st.total);
  $("timeBar").style.transform=`scaleX(${f})`;
  $("timer").classList.toggle("low",f<.3);
  if(st.time<=0){fail();return;}
  requestAnimationFrame(loop);
}
function toast(txt){const el=$("toast");el.textContent=txt;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),900);}

$("grid").addEventListener("click",e=>{
  const b=e.target.closest(".part");if(!b||!st.running)return;
  const p=b.dataset.p;
  if(st.need.includes(p)&&!st.got.includes(p)){
    st.got.push(p);b.classList.add("used");tone(520+st.got.length*90,.1);
    const slot=document.querySelector(`.slot[data-p="${p}"]`);
    fly(b,slot,()=>slot.classList.add("done"));
    if(st.got.length===st.need.length)win();
  }else{
    b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");
    st.time-=2;tone(140,.18,"sawtooth",.05);
  }
});
function fly(from,to,done){
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
  const el=document.createElement("div");el.className="flyer";el.innerHTML=from.innerHTML;
  Object.assign(el.style,{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px"});
  document.body.appendChild(el);
  requestAnimationFrame(()=>{const s=b.width/a.width;el.style.transform=`translate(${b.left-a.left+(b.width-a.width)/2}px,${b.top-a.top+(b.height-a.height)/2}px) scale(${s})`;});
  setTimeout(()=>{el.remove();done()},460);
}
function win(){
  st.running=false;
  const bonus=10+Math.ceil(Math.max(0,st.time))*2;
  setTimeout(()=>{
    $("machine").classList.add("alive");$("customer").classList.add("cheer");
    [660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,.15,"triangle",.07),i*120));
    st.coins+=bonus;renderHud();toast(`+${bonus} coins!`);
  },480);
  setTimeout(()=>{st.level++;nextOrder()},2300);
}
function fail(){
  st.running=false;st.lives--;renderHud();
  $("customer").classList.add("sad");$("bubble").innerHTML="Oh no, too late! Let's try the next one.";
  tone(220,.25,"triangle",.07);setTimeout(()=>tone(160,.35,"triangle",.07),200);
  setTimeout(()=>{st.lives>0?nextOrder():gameOver()},1700);
}
function gameOver(){
  show("over");$("final").textContent=st.coins;
  let rec=false;if(st.coins>best){best=st.coins;rec=true;try{localStorage.setItem("ww-best",best)}catch(e){}}
  $("overNote").textContent=rec?"coins · new best score!":`coins · you reached level ${st.level}`;
  showBest();
}
$("play").onclick=startGame;$("again").onclick=startGame;

// ---------- App: pause when hidden, Android back button ----------
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(st.running){st.paused=true;st.running=false;} }
  else if(st.paused){st.paused=false;st.running=true;st.last=performance.now();requestAnimationFrame(loop);}
});
try{
  const AppPlugin=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(AppPlugin)AppPlugin.addListener("backButton",()=>{
    if(!$("start").hidden)return AppPlugin.exitApp();
    st.running=false;st.paused=false;show("start");showBest();
  });
}catch(e){}
</script>
